<!doctype html>
<html><head><meta charset="utf-8"><title>theo — agent voice lockup</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;height:100%;font-family:'Supreme',system-ui,sans-serif}
  .grid{display:grid;grid-template-columns:1fr 1fr;height:100%;background:rgba(0,0,0,0.06);gap:1px}
  .cell{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:24px 32px}
  .light{background:#FFFFFF;color:#1A1A1A}
  .dark{background:#1A1A1A;color:#F4F5F7}

  .stack{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:22px;width:100%;max-width:560px}

  .lockup{display:block;height:auto;max-width:88%;max-height:62%;object-fit:contain}

  .meta{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-family:ui-monospace,SF Mono,Menlo,monospace;opacity:.55}

  .tag{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;
       font-size:9.5px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;
       font-family:ui-monospace,SF Mono,Menlo,monospace}
  .light .tag{background:rgba(26,26,26,.06);color:#1A1A1A}
  .dark .tag{background:rgba(244,245,247,.10);color:#F4F5F7}

  .note{position:absolute;left:18px;top:14px;z-index:2;font-size:10.5px;font-weight:500;
        font-family:ui-monospace,SF Mono,Menlo,monospace;letter-spacing:.04em;max-width:300px;line-height:1.5}
  .light .note{color:rgba(26,26,26,.55)}
  .dark .note{color:rgba(244,245,247,.55)}

  .lbl{position:absolute;left:18px;bottom:14px;z-index:2;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-family:ui-monospace,SF Mono,Menlo,monospace}
  .light .lbl{color:rgba(26,26,26,.45)}
  .dark .lbl{color:rgba(244,245,247,.55)}
</style></head><body>

<div class="grid">
  <div class="cell light">
    <div class="note">Agent voice. Use anywhere THEO is speaking,<br/>listening, or being summoned — not for the platform.</div>
    <div class="stack">
      <span class="tag">theo · agent voice</span>
      <img class="lockup" src="../assets/theo-lockup-light.png" alt="theo lockup, dark on light">
    </div>
    <div class="lbl">on light</div>
  </div>

  <div class="cell dark">
    <div class="note" style="color:rgba(244,245,247,.55)">Inverse — same use cases on dark surfaces.<br/>Pairs with the THEOS platform mark, never replaces it.</div>
    <div class="stack">
      <span class="tag">theo · agent voice</span>
      <img class="lockup" src="../assets/theo-lockup-dark.png" alt="theo lockup, light on dark">
    </div>
    <div class="lbl">on dark</div>
  </div>
</div>

</body></html>
