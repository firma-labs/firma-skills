<!doctype html>
<html><head><meta charset="utf-8"><title>Input — Ask THEO</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;height:100%;font-family:'Supreme',system-ui,sans-serif;color:#F4F5F7;-webkit-font-smoothing:antialiased}

  /* Studio stage — warm paper with sharp geometry behind glass */
  .stage{
    position:relative;height:100%;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    background:#EDE6DC;
    color:#1A1A1A;
  }
  /* Hard-edged dark shapes — give the glass real geometry to refract */
  .stage::before{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
    background:
      linear-gradient(115deg,
        transparent 0%, transparent 22%,
        rgba(26,26,26,0.92) 22%, rgba(26,26,26,0.92) 27%,
        transparent 27%, transparent 54%,
        rgba(26,26,26,0.92) 54%, rgba(26,26,26,0.92) 60%,
        transparent 60%, transparent 78%,
        rgba(26,26,26,0.92) 78%, rgba(26,26,26,0.92) 82%,
        transparent 82%);
  }
  /* Sharp hairline grid — fine paper grid, sharp through glass */
  .stage::after{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
    background-image:
      linear-gradient(to right, rgba(26,26,26,0.10) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(26,26,26,0.10) 1px, transparent 1px);
    background-size:48px 48px;
  }

  /* Header */
  .header{
    position:absolute;top:0;left:0;right:0;z-index:5;
    padding:22px 32px 0;
    display:flex;justify-content:space-between;align-items:baseline;
  }
  .header{z-index:10}
  .h-title{font-size:14px;font-weight:700;letter-spacing:-0.01em;color:#1A1A1A}
  .h-meta{font-family:ui-monospace,SF Mono,Menlo,monospace;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(26,26,26,0.55)}

  .hero-wrap{
    position:relative;z-index:3;
    width:min(620px, 84%);
    display:flex;flex-direction:column;gap:32px;
  }

  .eyebrow{
    text-align:center;
    font-family:ui-monospace,SF Mono,Menlo,monospace;
    font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    color:rgba(26,26,26,0.55);
  }
  .hero-wrap{z-index:5}

  /* ─── Liquid-glass pill on tan paper ─── */
  .pill{
    position:relative;
    height:72px;border-radius:9999px;
    background:rgba(40,30,20,0.18);
    box-shadow:
      0 24px 48px -16px rgba(40,30,20,0.30),
      inset 0 1px 0 rgba(255,255,255,0.55),
      inset 0 -1px 0 rgba(0,0,0,0.08);
    isolation:isolate;
    overflow:hidden;
  }
  .pill::before{
    content:"";position:absolute;inset:0;border-radius:inherit;
    backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
    z-index:-1;
  }
  /* removed the chunky outlined ::after rim entirely */
  .pill-inner{
    position:relative;
    display:flex;align-items:center;gap:16px;
    height:100%;padding:0 10px 0 28px;
    color:#1A1A1A;
  }
  .leading{
    width:24px;height:24px;flex:0 0 auto;color:#1A1A1A;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .ph{
    flex:1 1 auto;min-width:0;
    font-family:'Supreme',system-ui,sans-serif;
    font-size:19px;font-weight:500;letter-spacing:-0.005em;
    color:rgba(26,26,26,0.72);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .val{
    flex:1 1 auto;min-width:0;
    font-family:'Supreme',system-ui,sans-serif;
    font-size:19px;font-weight:500;letter-spacing:-0.005em;
    color:#1A1A1A;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    display:flex;align-items:center;gap:2px;
  }
  .kbd{
    flex:0 0 auto;
    font-family:ui-monospace,SF Mono,Menlo,monospace;
    font-size:11px;font-weight:600;letter-spacing:.04em;
    color:rgba(26,26,26,0.55);
    padding:0 6px;
  }
  .caret{display:inline-block;width:2px;height:22px;background:#1A1A1A;border-radius:1px;animation:blink 1.1s steps(2,end) infinite;vertical-align:middle}
  .caret{display:inline-block;width:2px;height:22px;background:#FFFFFF;border-radius:1px;animation:blink 1.1s steps(2,end) infinite;vertical-align:middle}
  @keyframes blink{50%{opacity:0}}

  /* Mic — solid black disc, sharp icon */
  .mic{
    position:relative;flex:0 0 auto;
    width:52px;height:52px;border-radius:9999px;
    background:#1A1A1A;
    display:inline-flex;align-items:center;justify-content:center;
    color:#FFFFFF;cursor:pointer;border:0;
    transition:transform .12s ease;
  }
  .mic:hover{transform:scale(1.04)}

  /* Active mic — inverted, white disc with black icon */
  .mic.active{
    background:#FFFFFF;color:#1A1A1A;
    box-shadow:0 0 0 1px rgba(26,26,26,0.08);
  }

  /* Focus ring — thin halo only */
  .pill.focus{
    box-shadow:
      0 24px 48px -16px rgba(40,30,20,0.30),
      inset 0 1px 0 rgba(255,255,255,0.65),
      inset 0 -1px 0 rgba(0,0,0,0.08),
      0 0 0 2px rgba(26,26,26,0.18);
  }

  /* Compact state pills */
  .states{display:flex;flex-direction:column;gap:14px;margin-top:4px}
  .state-row{display:flex;align-items:center;gap:18px}
  .state-tag{
    width:90px;flex:0 0 auto;
    font-family:ui-monospace,SF Mono,Menlo,monospace;
    font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(26,26,26,0.55);
  }
  .state-pill{flex:1 1 auto}

  .pill.sm{height:50px}
  .pill.sm .pill-inner{padding:0 7px 0 20px;gap:12px}
  .pill.sm .leading{width:18px;height:18px}
  .pill.sm .ph,.pill.sm .val{font-size:14.5px}
  .pill.sm .mic{width:36px;height:36px}
  .pill.sm .mic svg{width:16px;height:16px}
  .pill.sm .caret{height:17px}

  .pill.disabled{opacity:0.55}

  svg{display:block}
</style></head><body>
<div class="stage">
  <div class="header">
    <span class="h-title">Input · Ask THEO</span>
    <span class="h-meta">glass capsule · inline mic</span>
  </div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-spark" viewBox="0 0 24 24">
        <path fill="currentColor" d="M12 2.5l1.6 5.6 5.6 1.6-5.6 1.6L12 16.9l-1.6-5.6-5.6-1.6 5.6-1.6Z"/>
        <circle cx="19" cy="18" r="1.6" fill="currentColor"/>
        <circle cx="5" cy="17" r="1.2" fill="currentColor"/>
      </symbol>
      <symbol id="i-mic" viewBox="0 0 24 24">
        <rect x="9" y="3" width="6" height="12" rx="3" fill="currentColor"/>
        <path fill="currentColor" d="M6 11a1.4 1.4 0 0 1 2.8 0 3.2 3.2 0 0 0 6.4 0 1.4 1.4 0 0 1 2.8 0 6 6 0 0 1-4.6 5.83V19a1.4 1.4 0 0 1-2.8 0v-2.17A6 6 0 0 1 6 11Z"/>
      </symbol>
    </defs>
  </svg>

  <div class="hero-wrap">

    <div class="eyebrow">Ask THEO · idle</div>

    <!-- HERO pill -->
    <div class="pill">
      <div class="pill-inner">
        <span class="leading"><svg width="24" height="24"><use href="#i-spark"/></svg></span>
        <span class="ph">Ask THEO anything…</span>
        <span class="kbd">⌘K</span>
        <button class="mic" aria-label="speak">
          <svg width="22" height="22"><use href="#i-mic"/></svg>
        </button>
      </div>
    </div>

    <div class="states">
      <div class="state-row">
        <span class="state-tag">Focus</span>
        <div class="state-pill">
          <div class="pill sm focus">
            <div class="pill-inner">
              <span class="leading"><svg width="18" height="18"><use href="#i-spark"/></svg></span>
              <span class="val">Pull last week's edge nodes<span class="caret"></span></span>
              <button class="mic" aria-label="speak"><svg width="16" height="16"><use href="#i-mic"/></svg></button>
            </div>
          </div>
        </div>
      </div>

      <div class="state-row">
        <span class="state-tag">Listening</span>
        <div class="state-pill">
          <div class="pill sm">
            <div class="pill-inner">
              <span class="leading"><svg width="18" height="18"><use href="#i-spark"/></svg></span>
              <span class="val">Listening…</span>
              <button class="mic active" aria-label="speak"><svg width="16" height="16"><use href="#i-mic"/></svg></button>
            </div>
          </div>
        </div>
      </div>

      <div class="state-row">
        <span class="state-tag">Disabled</span>
        <div class="state-pill">
          <div class="pill sm disabled">
            <div class="pill-inner">
              <span class="leading"><svg width="18" height="18"><use href="#i-spark"/></svg></span>
              <span class="ph" style="font-size:14.5px">Connect a workspace to begin</span>
              <button class="mic" aria-label="speak"><svg width="16" height="16"><use href="#i-mic"/></svg></button>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
</body></html>
