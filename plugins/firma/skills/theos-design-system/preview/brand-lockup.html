<!doctype html>
<html><head><meta charset="utf-8"><title>THEOS lockup</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;height:100%;font-family:'Supreme',system-ui,sans-serif;color:#0B0F14}
  #root{height:100%}

  .grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;height:100%;background:rgba(0,0,0,0.06);gap:1px}
  .cell{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:28px 36px}
  .light{background:#FFFFFF}
  .light::before{content:"";position:absolute;inset:0;
    background:radial-gradient(80% 100% at 30% 15%,#FFFFFF 0%,transparent 60%),radial-gradient(60% 80% at 80% 90%,#F4F4F4,transparent 70%);
    pointer-events:none}
  .dark{background:#0B0F14}
  .dark::before{content:"";position:absolute;inset:0;
    background:radial-gradient(70% 80% at 30% 20%,rgba(255,255,255,.05),transparent 70%),radial-gradient(60% 70% at 80% 80%,rgba(120,140,180,.05),transparent 70%);
    pointer-events:none}

  .stack{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:24px;width:100%;max-width:560px}
  .meta{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-family:ui-monospace,SF Mono,Menlo,monospace;opacity:.55}
  .light .meta{color:#0B0F14}
  .dark .meta{color:#F4F5F7}

  .lockup{display:flex;align-items:center;gap:18px;line-height:1}
  .mark{flex:0 0 auto;display:block;object-fit:contain;width:84px;height:84px}
  .dark .mark{filter:invert(1) brightness(2)}

  .word{font-family:'Supreme',system-ui,sans-serif;font-weight:700;letter-spacing:-0.025em;line-height:1;font-size:84px}
  .light .word{color:#0B0F14}
  .dark .word{color:#FFFFFF}

  /* Striped overlay on the OS letters */
  .os-wrap{position:relative;display:inline-block}
  .os-wrap.striped::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:repeating-linear-gradient(
      to bottom,
      var(--stripe-bg) 0,
      var(--stripe-bg) var(--stripe-h),
      transparent var(--stripe-h),
      transparent calc(var(--stripe-h) + var(--stripe-gap))
    );
  }
  .light .os-wrap.striped{--stripe-bg:#FFFFFF}
  .dark  .os-wrap.striped{--stripe-bg:#0B0F14}

  .lbl{position:absolute;left:18px;bottom:14px;z-index:2;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-family:ui-monospace,SF Mono,Menlo,monospace}
  .light .lbl{color:rgba(11,15,20,.45)}
  .dark .lbl{color:rgba(244,245,247,.55)}

  .tag{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;
       font-size:9.5px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;
       font-family:ui-monospace,SF Mono,Menlo,monospace}
  .light .tag{background:rgba(11,15,20,.06);color:#0B0F14}
  .dark .tag{background:rgba(244,245,247,.10);color:#F4F5F7}

  .note{position:absolute;left:18px;top:14px;z-index:2;font-size:10px;font-weight:500;
        font-family:ui-monospace,SF Mono,Menlo,monospace;letter-spacing:.04em;max-width:260px;line-height:1.5}
  .light .note{color:rgba(11,15,20,.55)}
  .dark .note{color:rgba(244,245,247,.55)}
</style>
</head><body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "stripeCount": 31,
  "stripeRatio": 0.45,
  "lockupSize": 84
}/*EDITMODE-END*/;

const Lockup = ({ size, striped, count, ratio }) => {
  const h = (size * ratio) / count;
  const gap = (size * (1 - ratio)) / count;
  const osStyle = striped ? {
    '--stripe-h': h.toFixed(2) + 'px',
    '--stripe-gap': gap.toFixed(2) + 'px',
  } : {};
  return (
    <div className="lockup">
      <img className="mark" src="../assets/theos-mark.png" alt=""
        style={{ width: size, height: size, flex: `0 0 ${size}px` }} />
      <span className="word" style={{ fontSize: size }}>
        <span>THE</span>
        <span className={'os-wrap' + (striped ? ' striped' : '')} style={osStyle}>OS</span>
      </span>
    </div>
  );
};

const App = () => {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  return (
    <>
      <div className="grid">

        {/* Row 1 — Primary (solid) */}
        <div className="cell light">
          <div className="note">Primary lockup. Use everywhere by default —<br/>UI, docs, app icon contexts.</div>
          <div className="stack">
            <span className="tag">Primary · solid</span>
            <Lockup size={t.lockupSize} striped={false} />
          </div>
          <div className="lbl">on light</div>
        </div>
        <div className="cell dark">
          <div className="note" style={{color:'rgba(244,245,247,.55)'}}>Inverse of the primary lockup.<br/>Same rules, dark surfaces.</div>
          <div className="stack">
            <span className="tag">Primary · solid</span>
            <Lockup size={t.lockupSize} striped={false} />
          </div>
          <div className="lbl">on dark</div>
        </div>

        {/* Row 2 — Editorial (striped) */}
        <div className="cell light">
          <div className="note">Editorial lockup. Reserve for marketing,<br/>covers, swag, large-format hero moments.</div>
          <div className="stack">
            <span className="tag">Editorial · striped</span>
            <Lockup size={t.lockupSize} striped={true}
                    count={t.stripeCount} ratio={t.stripeRatio} />
          </div>
          <div className="lbl">on light</div>
        </div>
        <div className="cell dark">
          <div className="note" style={{color:'rgba(244,245,247,.55)'}}>Inverse editorial lockup.<br/>Same rules, dark surfaces.</div>
          <div className="stack">
            <span className="tag">Editorial · striped</span>
            <Lockup size={t.lockupSize} striped={true}
                    count={t.stripeCount} ratio={t.stripeRatio} />
          </div>
          <div className="lbl">on dark</div>
        </div>
      </div>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Editorial stripes" />
        <TweakSlider label="Stripe count" value={t.stripeCount}
          min={6} max={40} step={1}
          onChange={(v) => setTweak('stripeCount', v)} />
        <TweakSlider label="Stripe weight" value={t.stripeRatio}
          min={0.10} max={0.85} step={0.05} unit=""
          onChange={(v) => setTweak('stripeRatio', v)} />
        <TweakSection label="Lockup" />
        <TweakSlider label="Size" value={t.lockupSize}
          min={48} max={140} step={4} unit="px"
          onChange={(v) => setTweak('lockupSize', v)} />
      </TweaksPanel>
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
