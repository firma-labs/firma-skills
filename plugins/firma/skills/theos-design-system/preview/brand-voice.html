<!doctype html>
<html><head><meta charset="utf-8"><title>Voice — do / don't</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;height:100%;font-family:'Supreme',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

  .grid{display:grid;grid-template-columns:1fr 1fr;height:100%}

  .cell{
    position:relative;
    padding:56px 56px 36px;
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .dont{background:#3f3f3f;color:#F4F5F7}
  .do{background:#FFFFFF;color:#1A1A1A}

  .header{
    position:absolute;top:0;left:0;right:0;
    padding:22px 32px 0;
    display:flex;justify-content:space-between;align-items:baseline;
  }
  .h-title{font-size:13px;font-weight:700;letter-spacing:-0.005em}
  .dont .h-title{color:#F4F5F7}
  .do .h-title{color:#1A1A1A}

  .h-meta{
    font-family:ui-monospace,SF Mono,Menlo,monospace;
    font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  }
  .dont .h-meta{color:rgba(244,245,247,0.55)}
  .do .h-meta{color:rgba(26,26,26,0.45)}

  .eyebrow{
    font-family:ui-monospace,SF Mono,Menlo,monospace;
    font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    margin-bottom:28px;
  }
  .dont .eyebrow{color:#FF073A}
  .do .eyebrow{color:rgba(26,26,26,0.50)}

  .lines{display:flex;flex-direction:column;gap:18px;flex:1 1 auto;justify-content:center}

  .line{
    font-family:'Supreme',system-ui,sans-serif;
    font-weight:500;
    font-size:22px;
    letter-spacing:-0.012em;
    line-height:1.25;
  }
  .dont .line{
    color:rgba(244,245,247,0.78);
    text-decoration:line-through;
    text-decoration-color:#FF073A;
    text-decoration-thickness:2px;
  }
  .do .line{
    color:#1A1A1A;
    font-weight:600;
  }

  .footer{
    margin-top:24px;
    font-family:ui-monospace,SF Mono,Menlo,monospace;
    font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  }
  .dont .footer{color:rgba(244,245,247,0.45)}
  .do .footer{color:rgba(26,26,26,0.40)}

  /* divider */
  .grid::after{
    content:"";position:absolute;top:0;bottom:0;left:50%;
    width:1px;background:rgba(0,0,0,0.06);
    pointer-events:none;
  }
  .grid{position:relative}
</style></head><body>

<div class="grid">

  <div class="cell dont">
    <div class="header">
      <span class="h-title">Voice</span>
      <span class="h-meta">don't</span>
    </div>
    <div class="eyebrow">Avoid</div>
    <div class="lines">
      <div class="line">Welcome! 👋 How can I help?</div>
      <div class="line">Generating your spreadsheet…</div>
      <div class="line">✅ Ready! Click to open.</div>
      <div class="line">Cancel</div>
    </div>
    <div class="footer">chatty · emoji · exclaimed</div>
  </div>

  <div class="cell do">
    <div class="header">
      <span class="h-title">Voice</span>
      <span class="h-meta">do</span>
    </div>
    <div class="eyebrow">Write</div>
    <div class="lines">
      <div class="line">Ask. THEO listens.</div>
      <div class="line">Pulling. One moment.</div>
      <div class="line">Here.</div>
      <div class="line">Let go</div>
    </div>
    <div class="footer">terse · grounded · sure</div>
  </div>

</div>

</body></html>
