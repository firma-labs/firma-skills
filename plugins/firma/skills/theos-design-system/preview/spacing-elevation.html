<!doctype html>
<html><head><meta charset="utf-8"><title>Elevation</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;height:100%}
  .stage{height:100%;background:url('../assets/bg_room_night.jpg') center/cover;position:relative}
  .stage::after{content:'';position:absolute;inset:0;background:rgba(28,42,62,.55)}
  .row{position:relative;z-index:1;display:flex;gap:18px;justify-content:center;align-items:center;height:100%;padding:14px}
  .card{width:170px;height:110px;border-radius:20px;background:rgba(255,255,255,.14);backdrop-filter:blur(60px);-webkit-backdrop-filter:blur(60px);border:1px solid rgba(255,255,255,.10);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;color:#fff}
  .lo{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 16px rgba(0,0,0,.18)}
  .md{box-shadow:inset 0 1px 0 rgba(255,255,255,.30),0 24px 64px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.18)}
  .hi{box-shadow:inset 0 1px 0 rgba(255,255,255,.40),0 32px 96px rgba(0,0,0,.45),0 4px 12px rgba(0,0,0,.22)}
  .name{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
  .meta{font-size:10px;font-family:ui-monospace,monospace;color:rgba(255,255,255,.6)}
</style></head><body>
<div class="stage"><div class="row">
  <div class="card lo"><div class="name">Resting</div><div class="meta">y8 · 16</div></div>
  <div class="card md"><div class="name">Ambient</div><div class="meta">y24 · 64</div></div>
  <div class="card hi"><div class="name">Lifted</div><div class="meta">y32 · 96</div></div>
</div></div>
</body></html>
