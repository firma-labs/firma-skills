<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--canvas);width:700px;height:300px;box-sizing:border-box;
       padding:0;display:flex;flex-direction:column;}
  .band{flex:1;display:flex;align-items:center;padding:0 40px;}
  .band img{height:44px;}
  .light{background:var(--canvas);}
  .cream{background:var(--surface-card);}
  .dark{background:var(--ink);}
  /* composed acid lockup — locked spacing standard (orb 0.9em, gap 0.2em) */
  .lockup{display:flex;align-items:center;gap:.2em;font-size:38px;}
  .lockup img{width:.9em;height:.9em;display:block;}
  .lockup .wm{font-family:var(--font-mark);font-weight:700;font-size:1em;letter-spacing:-.047em;
              text-transform:lowercase;font-feature-settings:"liga" 0;color:var(--ink);line-height:1;}
  .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-left:auto;}
</style>
</head>
<body>
  <div class="band light"><img src="../assets/logo-lockup-ink.png" alt="firma frontier lockup, ink"><span class="lbl" style="color:var(--ink-3)">on white · ink</span></div>
  <div class="band cream">
    <div class="lockup"><img src="../assets/orb-acid-smooth.png" alt=""><span class="wm">firma frontier</span></div>
    <span class="lbl" style="color:var(--ink-3)">on white · acid orb</span>
  </div>
  <div class="band dark"><img src="../assets/logo-lockup-yellow.png" alt="firma frontier lockup, yellow"><span class="lbl" style="color:rgba(255,255,255,.45)">on ink · yellow</span></div>
</body>
</html>
