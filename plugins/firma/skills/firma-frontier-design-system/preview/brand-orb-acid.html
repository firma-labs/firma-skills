<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--canvas);width:700px;height:240px;box-sizing:border-box;
       display:flex;align-items:center;gap:26px;padding:0 44px;}
  .orb{width:84px;height:84px;display:block;flex:none;}
  .wm{font-family:var(--font-mark);font-weight:700;font-size:52px;letter-spacing:-.047em;
      text-transform:lowercase;font-feature-settings:"liga" 0;color:var(--ink);line-height:1;}
  .meta{margin-left:auto;text-align:right;}
  .meta .t{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);line-height:1.7;}
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <script type="text/babel">
    const FILLS = {
      "Smooth acid":   "../assets/orb-acid-smooth.png",
      "Pink → Yellow": "../assets/orb-acid-pinkyellow.png",
      "Mesh":          "../assets/orb-acid-meshfill.png",
      "Solid yellow":  "../assets/orb-acid-solid.png",
      "Ink":           "../assets/orb-ink-official.png",
    };

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "fill": "Smooth acid",
      "size": 60
    }/*EDITMODE-END*/;

    function Lockup() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      return (
        <React.Fragment>
          <img className="orb" src={FILLS[t.fill] || FILLS["Smooth acid"]}
               style={{ width: t.size, height: t.size }} alt="Firma Frontier orb"/>
          <span className="wm">firma frontier</span>
          <div className="meta">
            <div className="t">acid-iridescent orb</div>
            <div className="t">{t.fill.toLowerCase()} fill</div>
            <div className="t">official silhouette</div>
          </div>

          <TweaksPanel title="Tweaks">
            <TweakSection label="Orb" />
            <TweakSelect label="Fill" value={t.fill}
              options={Object.keys(FILLS)}
              onChange={(v)=>setTweak('fill', v)} />
            <TweakSlider label="Size" min={56} max={120} step={2}
              value={t.size} onChange={(v)=>setTweak('size', v)} />
          </TweaksPanel>
        </React.Fragment>
      );
    }

    const host = document.getElementById('root');
    host.style.display = 'contents';
    ReactDOM.createRoot(host).render(<Lockup />);
  </script>
</body>
</html>
