<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;height:100%;}
  body{background:#0d0c0f;display:flex;align-items:center;justify-content:center;overflow:hidden;
       font-family:var(--font-mono);}
  #wrap{position:relative;width:100%;height:100vh;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;touch-action:none;cursor:crosshair;}
  .hint{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);
        font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.34);
        pointer-events:none;}
  .wm{position:fixed;left:50%;top:34px;transform:translateX(-50%);
      font-family:var(--font-mark);font-weight:700;font-size:18px;letter-spacing:-.04em;
      color:rgba(255,255,255,.6);text-transform:lowercase;font-feature-settings:"liga" 0;}
</style>
</head>
<body>
  <div class="wm">firma frontier</div>
  <div id="wrap"><canvas id="c"></canvas></div>
  <div class="hint">move · hover · drag to disturb</div>

  <script>
  (function(){
    const SRC = "../assets/orb-acid-smooth.png"; // real orb geometry + acid colors
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const DPR = Math.min(window.devicePixelRatio || 1, 2);

    let particles = [];
    let W=0, H=0, ORB=0, OX=0, OY=0;
    const pointer = { x:-9999, y:-9999, down:false, active:false };

    // ── acid gradient ramp (110°): pink → peach → warm → acid yellow ─────────
    const STOPS = [
      [0.00, [255,166,194]],
      [0.40, [255,185,163]],
      [0.70, [255,194,143]],
      [1.00, [247,255,5]],
    ];
    function ramp(p){
      p = Math.max(0, Math.min(1, p));
      for (let i=0;i<STOPS.length-1;i++){
        const a=STOPS[i], b=STOPS[i+1];
        if (p>=a[0] && p<=b[0]){
          const t=(p-a[0])/(b[0]-a[0]);
          return [a[1][0]+(b[1][0]-a[1][0])*t, a[1][1]+(b[1][1]-a[1][1])*t, a[1][2]+(b[1][2]-a[1][2])*t];
        }
      }
      return STOPS[STOPS.length-1][1];
    }
    const ANG = 110*Math.PI/180, AX=Math.cos(ANG), AY=Math.sin(ANG);

    function addP(hx, hy, col, size, baseA){
      particles.push({ hx, hy, x:0, y:0, vx:0, vy:0,
        r:col[0], g:col[1], b:col[2], size, baseA: (baseA==null?1:baseA),
        jitter: Math.random()*Math.PI*2, jspeed: 0.4 + Math.random()*0.8 });
    }

    const WHITE = [255,255,255];
    function build(){
      layout();
      particles = [];
      const D = ORB*2;                       // orb diameter in screen px
      const STEP = 3.0;                       // px spacing → dots touch into solid lines
      const sN = (lenNorm) => Math.max(2, Math.floor(lenNorm*D/STEP));
      const colAt = (hx,hy) => ramp((hx*AX + hy*AY) + 0.5);

      // 1) faint gradient haze INSIDE — sparse, low-opacity, so structure dominates
      const HAZE = 900;
      for (let i=0;i<HAZE;i++){
        const ang = Math.random()*Math.PI*2;
        const rr = Math.sqrt(Math.random())*0.47;
        const hx = Math.cos(ang)*rr, hy = Math.sin(ang)*rr;
        addP(hx, hy, colAt(hx,hy), 0.6 + Math.random()*0.7, 0.42);
      }
      // 2) CIRCLE outline — dense touching ring, gradient-coloured
      const ringN = sN(Math.PI);             // circumference = π·D
      for (let i=0;i<ringN;i++){
        const a = (i/ringN)*Math.PI*2;
        const hx = 0.5*Math.cos(a), hy = 0.5*Math.sin(a);
        addP(hx, hy, colAt(hx,hy), 1.5, 1);
      }
      // 3) MERIDIAN (vertical) + EQUATOR (horizontal) — bright white, touching
      const lineN = sN(1.0);
      for (let i=0;i<lineN;i++){
        const u = (i/(lineN-1) - 0.5);
        addP(0, u, WHITE, 1.5, 1);           // meridian
        addP(u, 0, WHITE, 1.5, 1);           // equator
      }
      // 4) SEED LENS — central pointed vesica (vertical), touching white dots
      const lensN = sN(1.0), lensW = 0.17, lensH = 0.9;
      for (let i=0;i<lensN;i++){
        const t = (i/(lensN-1))*2 - 1;        // -1..1
        const y = t*0.5*lensH;
        const x = lensW*(1 - t*t);            // parabolic → pointed top & bottom
        addP( x, y, WHITE, 1.4, 1);
        addP(-x, y, WHITE, 1.4, 1);
      }
      // seed positions from a scattered ring so it "assembles" on load
      for (const p of particles){
        const a = Math.random()*Math.PI*2;
        const rad = ORB*(0.7+Math.random()*0.9);
        p.x = OX + Math.cos(a)*rad;
        p.y = OY + Math.sin(a)*rad;
      }
      requestAnimationFrame(loop);
    }
    build();

    function layout(){
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.style.width = W+'px';
      canvas.style.height = H+'px';
      canvas.width = W*DPR; canvas.height = H*DPR;
      ctx.setTransform(DPR,0,0,DPR,0,0);
      ORB = Math.min(W,H) * 0.34;
      OX = W/2; OY = H/2;
    }
    window.addEventListener('resize', layout);

    // pointer
    function setP(e){
      const t = e.touches ? e.touches[0] : e;
      pointer.x = t.clientX; pointer.y = t.clientY; pointer.active = true;
    }
    window.addEventListener('mousemove', setP);
    window.addEventListener('mousedown', e=>{ pointer.down=true; setP(e); });
    window.addEventListener('mouseup',  ()=> pointer.down=false);
    window.addEventListener('mouseleave',()=>{ pointer.active=false; pointer.x=pointer.y=-9999; });
    window.addEventListener('touchstart', e=>{ pointer.down=true; setP(e); }, {passive:true});
    window.addEventListener('touchmove',  setP, {passive:true});
    window.addEventListener('touchend',   ()=>{ pointer.down=false; pointer.active=false; pointer.x=pointer.y=-9999; });

    let t = 0;
    function loop(){
      t += 0.016;
      ctx.clearRect(0,0,W,H);

      const REPEL = pointer.down ? 150 : 95;     // px radius
      const FORCE = pointer.down ? 2.2 : 1.25;
      const SPRING = 0.045, FRICTION = 0.86;
      const breathe = 1 + Math.sin(t*0.7)*0.012; // subtle alive scaling

      for (const p of particles){
        // target = home mapped to screen, with a touch of idle jitter (small → crisp lines)
        const jx = Math.cos(t*p.jspeed + p.jitter)*0.5;
        const jy = Math.sin(t*p.jspeed + p.jitter)*0.5;
        const tx = OX + p.hx*ORB*2*breathe + jx;
        const ty = OY + p.hy*ORB*2*breathe + jy;

        // spring toward target
        p.vx += (tx - p.x)*SPRING;
        p.vy += (ty - p.y)*SPRING;

        // repel from pointer
        if (pointer.active){
          const dx = p.x - pointer.x, dy = p.y - pointer.y;
          const d2 = dx*dx + dy*dy;
          const R = REPEL;
          if (d2 < R*R){
            const d = Math.sqrt(d2) || 1;
            const f = (1 - d/R) * FORCE * 14;
            p.vx += (dx/d)*f;
            p.vy += (dy/d)*f;
          }
        }

        p.vx *= FRICTION; p.vy *= FRICTION;
        p.x += p.vx; p.y += p.vy;

        // brightness pulse with speed → energetic when disturbed
        const sp = Math.min(1, (Math.abs(p.vx)+Math.abs(p.vy))/8);
        const a = Math.min(1, p.baseA*(0.82 + sp*0.5) + sp*0.4);
        ctx.beginPath();
        ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},${a})`;
        ctx.arc(p.x, p.y, p.size + sp*1.2, 0, Math.PI*2);
        ctx.fill();
      }
      requestAnimationFrame(loop);
    }
  })();
  </script>
</body>
</html>
