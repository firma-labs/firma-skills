<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--canvas);width:700px;height:240px;box-sizing:border-box;
       padding:30px 40px;display:flex;flex-direction:column;justify-content:center;gap:14px;}
  .tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);}
  .lock{display:flex;align-items:center;gap:.2em;font-size:58px;}
  .lock img{width:.9em;height:.9em;}
  .lock .ff-wordmark{font-size:1em;}
</style>
</head>
<body>
  <div><span class="tag">Wordmark · Space Grotesk 700 · −0.047em · ligatures OFF</span></div>
  <div class="lock">
    <img src="../assets/orb-acid-smooth.png" alt="Firma Frontier orb">
    <span class="ff-wordmark" style="font-size:58px;">firma frontier</span>
  </div>
  <div class="tag" style="color:var(--ink-3);">note the un-ligated “fi” — logo use only</div>
</body>
</html>
