<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--canvas);width:700px;height:200px;box-sizing:border-box;
       padding:28px 32px;display:flex;gap:14px;align-items:stretch;}
  .sw{flex:1;border-radius:var(--r-md);display:flex;flex-direction:column;justify-content:flex-end;
      padding:12px;border:1px solid var(--ink-line);}
  .sw .n{font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;}
  .sw .h{font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;opacity:.6;}
</style>
</head>
<body>
  <div class="sw" style="background:var(--canvas);"><span class="n" style="color:var(--ink)">Canvas</span><span class="h" style="color:var(--ink)">#ffffff</span></div>
  <div class="sw" style="background:var(--paper);"><span class="n" style="color:var(--ink)">Paper</span><span class="h" style="color:var(--ink)">#faf9f6</span></div>
  <div class="sw" style="background:var(--ink);border-color:var(--ink);"><span class="n" style="color:#fff">Ink</span><span class="h" style="color:#fff">#38353b</span></div>
  <div class="sw" style="background:var(--ink-2);border-color:var(--ink-2);"><span class="n" style="color:#fff">Ink-2</span><span class="h" style="color:#fff">#706d73</span></div>
  <div class="sw" style="background:var(--ink-3);border-color:var(--ink-3);"><span class="n" style="color:#fff">Ink-3</span><span class="h" style="color:#fff">#a7a3a9</span></div>
</body>
</html>
