<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--canvas);width:700px;height:200px;box-sizing:border-box;
       padding:28px 32px;display:flex;flex-direction:column;gap:18px;justify-content:center;}
  .tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);}
  .row{display:flex;gap:18px;align-items:flex-end;}
  .r{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .box{width:78px;height:64px;background:var(--paper);border:1px solid var(--paper-line);}
  .lbl{font-family:var(--font-mono);font-size:11px;color:var(--ink-2);}
</style>
</head>
<body>
  <span class="tag">Radii ladder</span>
  <div class="row">
    <div class="r"><div class="box" style="border-radius:10px"></div><span class="lbl">10 sm</span></div>
    <div class="r"><div class="box" style="border-radius:16px"></div><span class="lbl">16 md</span></div>
    <div class="r"><div class="box" style="border-radius:20px"></div><span class="lbl">20 card</span></div>
    <div class="r"><div class="box" style="border-radius:24px"></div><span class="lbl">24 lg</span></div>
    <div class="r"><div class="box" style="border-radius:40px"></div><span class="lbl">40 frame</span></div>
    <div class="r"><div class="box" style="border-radius:999px"></div><span class="lbl">999 pill</span></div>
  </div>
</body>
</html>
