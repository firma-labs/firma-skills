<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--l-backdrop);width:700px;min-height:440px;box-sizing:border-box;
       padding:26px;display:flex;align-items:center;justify-content:center;
       font-family:var(--font-body);position:relative;overflow:hidden;}
  .glow{position:absolute;top:-60px;right:-40px;width:420px;height:300px;border-radius:50%;
        background:var(--iridescent);filter:blur(70px);opacity:.32;z-index:0;}

  .win{position:relative;z-index:1;width:100%;max-width:648px;height:388px;border-radius:16px;overflow:hidden;
       background:var(--l-surface-1);border:1px solid var(--l-hairline);
       box-shadow:var(--l-shadow-pop);display:grid;grid-template-columns:188px 1fr;}

  .side{background:var(--l-surface-2);border-right:1px solid var(--l-hairline);
        padding:16px 12px;display:flex;flex-direction:column;gap:3px;}
  .brand{display:flex;align-items:center;gap:8px;padding:2px 6px 14px;}
  .brand img{width:20px;height:20px;display:block;}
  .brand b{font-family:var(--font-mark);font-weight:700;font-size:14px;letter-spacing:-.04em;color:var(--ink);
           text-transform:lowercase;font-feature-settings:"liga" 0;}
  .sgrp{font-family:var(--font-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
        color:var(--ink-3);padding:14px 8px 6px;}
  .row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;
       font-size:13.5px;letter-spacing:-.01em;color:var(--ink-2);cursor:pointer;
       transition:background .14s ease,color .14s ease;}
  .row .dot{width:15px;height:15px;border-radius:4px;background:#e6e2da;flex:none;}
  .row:hover{background:var(--l-hover);color:var(--ink);}
  .row.sel{background:var(--sel-fill);color:var(--sel-ink);}
  .row.sel .dot{background:var(--sel-dot);}

  .main{padding:18px 20px;display:flex;flex-direction:column;min-width:0;}
  .bar{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .nav{display:flex;gap:6px;}
  .nav b{width:28px;height:28px;border-radius:8px;background:var(--l-surface-2);
         display:flex;align-items:center;justify-content:center;color:var(--ink-2);font-size:14px;border:1px solid var(--l-hairline);}
  .title{font-family:var(--font-mark);font-weight:700;font-size:18px;letter-spacing:-.03em;color:var(--ink);
          font-feature-settings:"liga" 0;}

  .panel{background:var(--l-surface-2);border:1px solid var(--l-hairline);border-radius:12px;
         padding:14px;flex:1;display:flex;flex-direction:column;gap:10px;}
  .panel-h{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
           color:var(--ink-3);display:flex;justify-content:space-between;}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .c{background:var(--l-surface-3);border:1px solid var(--l-hairline);border-radius:10px;padding:12px 13px;
     box-shadow:var(--l-shadow);transition:box-shadow .14s ease,border-color .14s ease,transform .14s ease,background .14s ease;cursor:pointer;}
  .c:hover{transform:translateY(-1px);box-shadow:var(--shadow-soft);}
  .c .k{font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);}
  .c .v{font-family:var(--font-mark);font-weight:700;font-size:20px;letter-spacing:-.03em;color:var(--ink);margin-top:7px;
        font-feature-settings:"liga" 0;}
  .c .s{font-size:11.5px;color:var(--ink-2);margin-top:2px;}
  .legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:2px;}
  .legend span{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--ink-3);display:flex;align-items:center;gap:6px;}
  .legend i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--l-hairline-2);}
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <script type="text/babel">
    const ROWS = ["Recents","Shared"];
    const FUNDS = ["Firma Frontier","Onym Capital","Firma Terra"];
    const CARDS = [
      ["AI & compute","white card · soft shadow"],
      ["Deeptech","white card · soft shadow"],
      ["Network states","→ lifts on hover"],
      ["Charter cities","white card · soft shadow"],
    ];

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "cardSel": "Yellow fill",
      "sidebarSel": "Yellow fill",
      "glow": 0.26
    }/*EDITMODE-END*/;

    // Selected-card visual styles
    const CARD_STYLES = {
      "Yellow fill":  { background:"var(--accent)", borderColor:"var(--accent)",
                        boxShadow:"0 10px 28px rgba(150,158,0,.42), 0 2px 8px rgba(56,53,59,.14)",
                        kColor:"rgba(43,41,48,.6)", vColor:"var(--accent-ink)", sColor:"rgba(43,41,48,.7)" },
      "Yellow ring":  { background:"var(--l-surface-3)", borderColor:"var(--accent)",
                        boxShadow:"0 0 0 2px var(--accent), var(--l-shadow)",
                        kColor:"var(--ink-3)", vColor:"var(--ink)", sColor:"var(--ink-2)" },
      "Ink fill":     { background:"var(--ink)", borderColor:"var(--ink)", boxShadow:"var(--l-shadow)",
                        kColor:"rgba(255,255,255,.55)", vColor:"#fff", sColor:"rgba(255,255,255,.7)" },
    };
    const SIDEBAR_STYLES = {
      "Yellow fill": { fill:"var(--accent)", ink:"var(--accent-ink)", dot:"rgba(43,41,48,.35)" },
      "Ink fill":    { fill:"var(--ink)",    ink:"#fff",              dot:"rgba(255,255,255,.45)" },
      "Cream":       { fill:"var(--l-hover)",ink:"var(--ink)",        dot:"#d8d4cc" },
    };

    function Surfaces() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const cs = CARD_STYLES[t.cardSel] || CARD_STYLES["Yellow fill"];
      const ss = SIDEBAR_STYLES[t.sidebarSel] || SIDEBAR_STYLES["Yellow fill"];
      const sidebarVars = { "--sel-fill":ss.fill, "--sel-ink":ss.ink, "--sel-dot":ss.dot };

      return (
        <React.Fragment>
          <div className="glow" style={{ opacity:t.glow }}></div>
          <div className="win" style={sidebarVars}>
            <aside className="side">
              <div className="brand">
                <img src="../assets/orb-ink-official.png" alt="Firma Frontier orb"/>
                <b>frontier</b>
              </div>
              {ROWS.map(r => <div className="row" key={r}><span className="dot"></span>{r}</div>)}
              <div className="sgrp">Funds</div>
              {FUNDS.map((f,i) => (
                <div className={"row"+(i===0?" sel":"")} key={f}><span className="dot"></span>{f}</div>
              ))}
            </aside>
            <section className="main">
              <div className="bar">
                <div className="nav"><b>‹</b><b>›</b></div>
                <span className="title">portfolio</span>
              </div>
              <div className="panel">
                <div className="panel-h"><span>Surface 2 · panel</span><span>4 items</span></div>
                <div className="cards">
                  {CARDS.map(([k,s],i) => {
                    const on = i===0;
                    const st = on ? {
                      background:cs.background, borderColor:cs.borderColor, boxShadow:cs.boxShadow
                    } : {};
                    return (
                      <div className="c" key={k} style={st}>
                        <div className="k" style={on?{color:cs.kColor}:{}}>{k}</div>
                        <div className="v" style={on?{color:cs.vColor}:{}}>{on?"Selected":(i===2?"Hover me":"Resting")}</div>
                        <div className="s" style={on?{color:cs.sColor}:{}}>{on?t.cardSel.toLowerCase():s}</div>
                      </div>
                    );
                  })}
                </div>
                <div className="legend">
                  <span><i style={{background:"var(--l-backdrop)"}}></i>backdrop</span>
                  <span><i style={{background:"var(--l-surface-1)"}}></i>window</span>
                  <span><i style={{background:"var(--l-surface-2)"}}></i>panel</span>
                  <span><i style={{background:"var(--l-surface-3)"}}></i>card</span>
                  <span><i style={{background:"var(--accent)"}}></i>selected</span>
                </div>
              </div>
            </section>
          </div>

          <TweaksPanel title="Tweaks">
            <TweakSection label="Selection" />
            <TweakRadio label="Selected card" value={t.cardSel}
              options={["Yellow fill","Yellow ring","Ink fill"]}
              onChange={(v)=>setTweak('cardSel', v)} />
            <TweakRadio label="Selected row" value={t.sidebarSel}
              options={["Yellow fill","Ink fill","Cream"]}
              onChange={(v)=>setTweak('sidebarSel', v)} />
            <TweakSection label="Atmosphere" />
            <TweakSlider label="Glow" min={0} max={0.6} step={0.02}
              value={t.glow} onChange={(v)=>setTweak('glow', v)} />
          </TweaksPanel>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Surfaces />);
  </script>
</body>
</html>
