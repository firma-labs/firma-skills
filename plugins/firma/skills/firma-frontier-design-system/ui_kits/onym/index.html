<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onym Capital — Patient capital for the new economy</title>
<link rel="stylesheet" href="../../onym.css">
<style>
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font-body);
       -webkit-font-smoothing:antialiased;overflow-x:hidden;}
  @keyframes onOrbFloat{
    0%{transform:translateY(0)}
    100%{transform:translateY(-14px)}
  }
  @media (prefers-reduced-motion: reduce){
    [style*="onOrbFloat"]{animation:none !important}
  }
  @media (max-width: 980px){
    .on-hero-grid{grid-template-columns:1fr !important}
    .on-cred-grid{grid-template-columns:1fr !important}
    .on-navlinks{display:none !important}
    .on-back-grid{grid-template-columns:repeat(2,1fr) !important}
    .on-pillars{grid-template-columns:1fr !important; gap:40px !important}
    .on-pillar{border-left:none !important; padding-left:0 !important;
      border-top:1px solid var(--ink-line); padding-top:32px !important}
  }
  @media (max-width: 620px){
    .on-back-grid{grid-template-columns:1fr !important}
    .on-logos{grid-template-columns:repeat(2,1fr) !important}
  }
  a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="../../assets/dotmatrix.js"></script>
<script type="text/babel" src="atoms.jsx"></script>
<script type="text/babel" src="nav-hero.jsx"></script>
<script type="text/babel" src="sections.jsx"></script>
<script type="text/babel">
  function App() {
    return (
      <React.Fragment>
        <Nav />
        <Hero />
        <Thesis />
        <WhatWeBack />
        <Approach />
        <Credibility />
        <CTA />
        <Footer />
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
